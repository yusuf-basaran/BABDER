<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Girişi | BABDER Panel</title>
  <link rel="icon" type="image/png" href="../img/logo.png">
  <link rel="shortcut icon" type="image/png" href="../img/logo.png">
  <link rel="apple-touch-icon" href="../img/logo.png">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/panel.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body class="giris-kapsayici">
  <div class="kart giris-karti">
    <img src="../img/logo.png" alt="BABDER Logo" class="giris-logo">
    <h1 class="giris-baslik">BABDER Yönetim Paneli</h1>

    <form id="giris-formu">
      <div class="form-grup">
        <label for="eposta">Yönetici E-Posta</label>
        <input type="email" id="eposta" class="form-denetim" required autocomplete="username">
      </div>

      <div class="form-grup">
        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" class="form-denetim" required minlength="12" autocomplete="current-password">
      </div>

      <button type="submit" id="giris-btn" class="btn btn-ana full-width">Giriş Yap</button>
      <div id="giris-hata" class="toast-hata gizli" role="alert"></div>
    </form>
  </div>

  <script type="module">
    import { db } from "../js/api.js";

    document.getElementById("giris-formu")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const hataKutusu = document.getElementById("giris-hata");
      const btn = document.getElementById("giris-btn");
      hataKutusu.textContent = "";
      hataKutusu.classList.add("gizli");
      btn.disabled = true;

      const email = document.getElementById("eposta").value.trim();
      const sifre = document.getElementById("sifre").value;

      try {
        await db.signIn(email, sifre);
        window.location.href = "./index.html";
      } catch (err) {
        hataKutusu.textContent = "E-posta veya şifre hatalı.";
        hataKutusu.classList.remove("gizli");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
