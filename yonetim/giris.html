<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetici Girişi | BABDER Panel</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/panel.css">
  <meta name="robots" content="noindex, nofollow">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
  <div class="kart" style="width: 100%; max-width: 400px; padding: 2rem;">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <img src="/img/logo.png" alt="BABDER Logo" style="width: 64px; height: 64px;">
      <h1 style="font-size: 1.25rem; margin-top: 0.5rem;">BABDER Yönetim Paneli</h1>
    </div>

    <form id="giris-formu">
      <div class="form-grup">
        <label for="eposta">Yönetici E-Posta</label>
        <input type="email" id="eposta" class="form-denetim" required autocomplete="username">
      </div>

      <div class="form-grup">
        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" class="form-denetim" required minlength="12" autocomplete="current-password">
      </div>

      <button type="submit" id="giris-btn" class="btn btn-ana" style="width: 100%; margin-top: 1rem;">Giriş Yap</button>
      <div id="giris-hata" style="color: var(--renk-hata); margin-top: 1rem; font-size: 0.85rem;" role="alert"></div>
    </form>
  </div>

  <script type="module">
    import { db } from "/js/api.js";

    document.getElementById("giris-formu")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const hataKutusu = document.getElementById("giris-hata");
      const btn = document.getElementById("giris-btn");
      hataKutusu.textContent = "";
      btn.disabled = true;

      const email = document.getElementById("eposta").value.trim();
      const sifre = document.getElementById("sifre").value;

      try {
        await db.signIn(email, sifre);
        window.location.href = "/yonetim/index.html";
      } catch (err) {
        hataKutusu.textContent = "E-posta veya şifre hatalı.";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
