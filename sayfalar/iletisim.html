<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">

  <title>İletişim | BABDER</title>
  <meta name="description" content="BABDER iletişim formu, resmi merkez adresi ve telefon bilgileri.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#1B7F3B">

  <link rel="icon" type="image/png" href="../img/logo.png">
  <link rel="shortcut icon" type="image/png" href="../img/logo.png">
  <link rel="apple-touch-icon" href="../img/logo.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="İletişim | BABDER">
  <meta property="og:description" content="BABDER iletişim formu, resmi merkez adresi ve telefon bilgileri.">
  <meta property="og:image" content="../img/logo.png">

  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <a href="#ana-icerik" class="erisebilirlik-atla">Ana İçeriğe Geç</a>

  <!-- PARTIAL:header -->

  <main id="ana-icerik" class="kapsayici bolum-bosluk-buyuk">
    <h1>İletişim</h1>
    <div class="izgara-3">
      <div class="kart">
        <h2 class="kart-baslik">Dernek Merkezi</h2>
        <p><strong>Adres:</strong> <span data-ayar="adres">[DERNEK ADRESİ]</span></p>
        <p><strong>Telefon:</strong> <span data-ayar="telefon">[TELEFON NUMARASI]</span></p>
        <p><strong>E-Posta:</strong> <span data-ayar="eposta">[E-POSTA ADRESİ]</span></p>
        <p><a href="https://maps.google.com/?q=Siverek+Sanliurfa" target="_blank" rel="noopener noreferrer" class="btn btn-ikincil">Haritada Aç</a></p>
      </div>

      <form id="iletisim-formu" class="kart">
        <h2 class="kart-baslik">Bize Ulaşın</h2>
        <div class="bal-kupugu" aria-hidden="true"><input type="text" id="guvenlik_kodu" tabindex="-1"></div>
        <div class="form-grup"><label for="iletisim_ad">Adınız Soyadınız *</label><input type="text" id="iletisim_ad" class="form-denetim" required minlength="3" maxlength="100"></div>
        <div class="form-grup"><label for="iletisim_eposta">E-Posta Adresiniz *</label><input type="email" id="iletisim_eposta" class="form-denetim" required maxlength="150"></div>
        <div class="form-grup"><label for="iletisim_konu">Konu *</label><input type="text" id="iletisim_konu" class="form-denetim" required minlength="2" maxlength="150"></div>
        <div class="form-grup"><label for="iletisim_mesaj">Mesajınız *</label><textarea id="iletisim_mesaj" class="form-denetim" rows="5" required minlength="10" maxlength="5000"></textarea></div>
        <div class="form-grup"><label><input type="checkbox" id="iletisim_kvkk" required> <a href="./kvkk.html" target="_blank" rel="noopener noreferrer">Aydınlatma Metni</a>'ni onaylıyorum.</label></div>
        <button type="submit" class="btn btn-ana">Gönder</button>
        <div id="mesaj-durum" role="status" aria-live="polite"></div>
      </form>
    </div>
  </main>

  <!-- PARTIAL:cookie -->
  <!-- PARTIAL:footer -->

  <script type="module" src="../js/main.js"></script>
  <script type="module" src="../js/forms.js"></script>
</body>
</html>
